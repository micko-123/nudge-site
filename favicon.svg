<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Nudge">
  <!-- The Nudge app icon: the Rising coin mark on the deep blue tile. Same
       geometry and colours as NudgeLogoPainter in lib/app/theme/nudge_brand.dart. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C4A6E"/>
      <stop offset="0.62" stop-color="#0369A1"/>
      <stop offset="1" stop-color="#0E7FB5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#tile)"/>
  <g transform="translate(-1.5 -1)">
    <path d="M20 74L38 56L50 66L64 52" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="73" cy="38" r="14" fill="#FBBF24"/>
    <circle cx="73" cy="38" r="8" fill="none" stroke="#D97706" stroke-width="2.5"/>
  </g>
</svg>
